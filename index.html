:root {
  --color-bg: #111827;
  --color-surface: #0f172a;
  --color-surface2: #1f2937;
  --color-text: #f9fafb;
  --color-muted: #9ca3af;
  --color-primary: #ec4899;
  --color-accent: #8b5cf6;
  --color-success: #22c55e;
  --color-warning: #f59e0b;
}

* {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--color-bg);
  color: var(--color-text);
}

/* Nav link active state */
.nav-link {
  color: var(--color-muted);
}
.nav-link:hover {
  color: var(--color-text);
}
.nav-link.active {
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  color: #fff;
  box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
}

/* Gradient text helper */
.grad-text {
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

/* Primary button */
.btn-primary {
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  color: #fff;
  box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}
.btn-primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 10px 26px rgba(236, 72, 153, 0.45);
}
.btn-primary:active {
  transform: translateY(1px);
}
.btn-primary:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Ghost/secondary button */
.btn-ghost {
  background: var(--color-surface2);
  color: var(--color-text);
  border: 1px solid rgba(156, 163, 175, 0.2);
  transition: background 0.15s ease, transform 0.15s ease;
}
.btn-ghost:hover {
  background: #273449;
}
.btn-ghost:active {
  transform: translateY(1px);
}
.btn-ghost:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Form controls */
.field {
  background: var(--color-surface);
  border: 1px solid var(--color-surface2);
  color: var(--color-text);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
}
.field option {
  background: var(--color-surface);
  color: var(--color-text);
}

/* Card */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-surface2);
  border-radius: 16px;
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  border-radius: 9999px;
  padding: 0.25rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 600;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--color-success);
  color: #fff;
  font-weight: 600;
  padding: 0.75rem 1.25rem;
  border-radius: 9999px;
  box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
  opacity: 0;
  transition: transform 0.3s ease, opacity 0.3s ease;
  z-index: 50;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

</style>
</head>
<body class="min-h-screen bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
  <div class="flex min-h-screen flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-surface2)]/60 bg-[var(--color-bg)]/80 backdrop-blur">
      <div class="mx-auto flex max-w-[1024px] items-center justify-between gap-4 px-4 py-3 sm:px-8">
        <a href="#/ide" class="flex items-center gap-2.5" aria-label="Reels Studio - Beranda">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-[var(--color-primary)] to-[var(--color-accent)] text-white shadow-lg shadow-[var(--color-primary)]/30" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </span>
          <span class="text-lg font-extrabold tracking-tight">
            Reels<span class="bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-accent)] bg-clip-text text-transparent"> Studio</span>
          </span>
        </a>

        <!-- Nav -->
        <nav class="flex items-center gap-1 rounded-full border border-[var(--color-surface2)] bg-[var(--color-surface)] p-1" aria-label="Navigasi utama">
          <a href="#/ide" data-nav="ide" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Ide</a>
          <a href="#/skrip" data-nav="skrip" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Skrip</a>
          <a href="#/panduan" data-nav="panduan" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Panduan</a>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main id="app" class="mx-auto w-full max-w-[1024px] flex-1 px-4 py-8 sm:px-8"></main>

    <!-- Footer -->
    <footer class="border-t border-[var(--color-surface2)]/60 py-6">
      <div class="mx-auto max-w-[1024px] px-4 text-center text-sm text-[var(--color-muted)] sm:px-8">
        Reels Studio — pembantu produksi konten video pendek untuk kreator.
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./src/main.js"></script>
</body>
</html>
