<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reels Studio — Pembantu Produksi Konten Reels</title>
  <meta name="description" content="Bantu kreator menghasilkan ide dan menyusun skrip video pendek (reels Instagram) secara cepat." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="./src/style.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
  <div class="flex min-h-screen flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-surface2)]/60 bg-[var(--color-bg)]/80 backdrop-blur">
      <div class="mx-auto flex max-w-[1024px] items-center justify-between gap-4 px-4 py-3 sm:px-8">
        <a href="#/ide" class="flex items-center gap-2.5" aria-label="Reels Studio - Beranda">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-[var(--color-primary)] to-[var(--color-accent)] text-white shadow-lg shadow-[var(--color-primary)]/30" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </span>
          <span class="text-lg font-extrabold tracking-tight">
            Reels<span class="bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-accent)] bg-clip-text text-transparent"> Studio</span>
          </span>
        </a>

        <!-- Nav -->
        <nav class="flex items-center gap-1 rounded-full border border-[var(--color-surface2)] bg-[var(--color-surface)] p-1" aria-label="Navigasi utama">
          <a href="#/ide" data-nav="ide" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Ide</a>
          <a href="#/skrip" data-nav="skrip" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Skrip</a>
          <a href="#/panduan" data-nav="panduan" class="nav-link rounded-full px-3 py-1.5 text-sm font-semibold transition">Panduan</a>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main id="app" class="mx-auto w-full max-w-[1024px] flex-1 px-4 py-8 sm:px-8"></main>

    <!-- Footer -->
    <footer class="border-t border-[var(--color-surface2)]/60 py-6">
      <div class="mx-auto max-w-[1024px] px-4 text-center text-sm text-[var(--color-muted)] sm:px-8">
        Reels Studio — pembantu produksi konten video pendek untuk kreator.
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./src/main.js"></script>
</body>
</html>
